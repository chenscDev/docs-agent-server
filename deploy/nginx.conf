# Nginx：API（根路径）+ Android 分包 CDN
# 公网 IP 演示期（备案前）；将 server_name 换成你的 IP 或 _
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/docs-agent
#   sudo ln -sf /etc/nginx/sites-available/docs-agent /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    # —— 静态分包（RN Android CDN）——
    # 本机 rsync 到 /var/www/rn-cdn/，对外 URL：http://<IP>/cdn/rn/0.86.0/...
    location /cdn/ {
        alias /var/www/rn-cdn/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types application/javascript application/octet-stream text/plain application/json;
    }

    # —— 健康检查（可无 Token）——
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # —— FastAPI 业务（含 SSE：务必关 buffering）——
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
