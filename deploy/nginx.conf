# Nginx：API（根路径）+ Android 分包 CDN
# 公网 IP 演示期（备案前）；将 server_name 换成你的 IP 或 _
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/docs-agent
#   sudo ln -sf /etc/nginx/sites-available/docs-agent /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    # —— 静态分包（RN Android CDN）——
    # hash 文件长缓存；配置中心短缓存，避免 revision 不更新时读到旧 channel.json
    location /cdn/config/ {
        alias /var/www/rn-cdn/config/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        gzip on;
        gzip_types application/json text/plain;
    }

    # AI 短视频成片：反代到 uvicorn（data/video_out），避免与 /var/www/rn-cdn 双目录不一致
    location /cdn/video/ {
        proxy_pass http://127.0.0.1:8000/cdn/video/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400";
        types { video/mp4 mp4; image/jpeg jpg jpeg; image/png png; }
    }

    location /cdn/ {
        alias /var/www/rn-cdn/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types application/javascript application/octet-stream text/plain application/json;
    }

    # —— 健康检查（可无 Token）——
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # —— FastAPI 业务（含 SSE：务必关 buffering）——
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
